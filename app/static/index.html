<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMind RAG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: "#F8FAFC",
            panel: "#FFFFFF",
            elevated: "#FFFFFF",
            elevated2: "#F1F5F9",
            edge: "#E2E8F0",
            neon: "#16A34A",
            ebrand: "#2563EB",
          },
        },
      },
    };
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #23252f; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #2d3040; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(57, 255, 136, 0.55); }
      50% { box-shadow: 0 0 0 5px rgba(57, 255, 136, 0); }
    }
    @keyframes blinkCursor {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes askGlow {
      0% { box-shadow: 0 0 0 0 rgba(67, 100, 247, 0.5); }
      100% { box-shadow: 0 0 14px 3px rgba(67, 100, 247, 0.35); }
    }

    .anim-fadeUp { animation: fadeUp 0.35s ease both; }
    .anim-slideIn { animation: slideInLeft 0.3s ease both; }
    .pulse-dot { animation: pulseGlow 2s ease-in-out infinite; }
    .blink-cursor { animation: blinkCursor 1s steps(1) infinite; }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .accordion-body.open {
      max-height: 300px;
      opacity: 1;
    }
    .chevron { transition: transform 0.2s ease; }
    .chevron.open { transform: rotate(90deg); }

    /* Light theme + responsive layout */
    html, body { width: 100%; }
    body { background: #f8fafc; color: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    #messages { background: #f8fafc; }
    #questionInput { color: #0f172a; min-width: 0; }
    #questionInput::placeholder { color: #94a3b8; opacity: 1; }
    #docFilter { color: #334155; background: #f1f5f9; }
    #docFilter option { color: #0f172a; background: #fff; }
    #uploadBox { color: #475569; }
    #docList li { color: #334155; }
    .accordion-body p { color: #475569 !important; }
    .acc-toggle { color: #475569 !important; }
    .acc-toggle b { color: #0f172a !important; }
    .ask-form-inner { background: #fff; border-color: #cbd5e1; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
    .ask-form-inner:focus-within { border-color: #2563eb; }
    .chat-panel { min-width: 0; }
    #askButton { flex-shrink: 0; }
    @media (max-width: 700px) {
      html, body { min-height: 100%; height: auto; overflow: auto; }
      .app-shell { min-height: 100dvh; height: auto; }
      .app-header { padding: 14px 16px; position: sticky; top: 0; z-index: 20; }
      .app-header h1 { font-size: 19px; }
      .app-layout { flex-direction: column; overflow: visible; flex: 1; }
      .app-sidebar { width: 100%; min-width: 0; max-width: none; border-right: 0; border-bottom: 1px solid #e2e8f0; padding: 14px 16px; overflow: visible; }
      #uploadBox { padding: 14px; }
      #docList { margin-top: 10px; }
      .chat-panel { min-height: 52vh; min-height: 52dvh; overflow: visible; }
      #messages { min-height: 32vh; min-height: 32dvh; padding: 22px 14px 16px; overflow: visible; gap: 18px; }
      .ask-form { position: sticky; bottom: 0; z-index: 15; padding: 10px 12px max(12px, env(safe-area-inset-bottom)); background: rgba(248,250,252,.97); backdrop-filter: blur(12px); border-top: 1px solid #e2e8f0; }
      .ask-form-inner { border-radius: 16px; gap: 6px; padding: 6px; }
      #docFilter { max-width: 104px; padding: 8px 5px; font-size: 11px; }
      #questionInput { font-size: 14px; padding: 9px 4px; }
      #questionInput::placeholder { font-size: 12px; }
      #askButton { padding: 10px 14px; font-size: 13px; }
    }
    @media (max-width: 360px) {
      #docFilter { max-width: 82px; }
      #askButton { padding-inline: 10px; }
    }

    /* Keep the question composer visible regardless of viewport/flex sizing. */
    .ask-form {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      z-index: 1000 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      padding: 12px 14px max(12px, env(safe-area-inset-bottom)) !important;
      background: rgba(255,255,255,.98) !important;
      border-top: 1px solid #e2e8f0 !important;
      box-shadow: 0 -4px 18px rgba(15,23,42,.08) !important;
      backdrop-filter: blur(12px);
    }
    #messages { padding-bottom: 120px !important; }
    .ask-form-inner { width: 100%; min-height: 54px; border-radius: 16px !important; }
    #questionInput { display: block !important; visibility: visible !important; opacity: 1 !important; }
    @media (min-width: 701px) {
      .ask-form-inner { max-width: 760px; }
    }
  </style>
</head>
<body class="bg-void text-slate-900 min-h-screen overflow-hidden">
  <div class="app-shell flex flex-col h-screen">

    <!-- Header -->
    <header class="app-header flex items-center justify-between px-7 py-4 border-b border-edge bg-panel">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">DocuMind RAG</h1>
        <p class="text-sm text-gray-500">Ask questions about your documents</p>
      </div>
      <div class="flex items-center gap-2 text-sm text-gray-400">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-gray-600"></span>
        <span id="statusText">Checking...</span>
      </div>
    </header>

    <div class="app-layout flex flex-1 overflow-hidden">

      <!-- Sidebar -->
      <aside class="app-sidebar w-1/4 min-w-[260px] max-w-[340px] border-r border-edge bg-panel p-5 overflow-y-auto">
        <section class="mb-5 rounded-xl border border-edge bg-white p-3"><p id="authStatus" class="mb-3 text-xs text-slate-600">Loading secure sign-in...</p><form id="authForm" class="flex flex-col gap-2"><input id="authEmail" type="email" required autocomplete="email" placeholder="Email address" class="w-full rounded-lg border border-edge px-3 py-2 text-sm" /><input id="authPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="Password (8+ characters)" class="w-full rounded-lg border border-edge px-3 py-2 text-sm" /><button id="authSubmit" type="submit" class="rounded-lg bg-ebrand px-3 py-2 text-sm font-semibold text-white">Sign in</button><button id="authToggle" type="button" class="text-xs text-ebrand">Create account</button><button id="authForgot" type="button" class="text-xs text-slate-500 text-left">Forgot password?</button></form><div id="authRecoveryPanel" hidden class="mt-3 flex flex-col gap-2"><label for="authNewPassword" class="text-xs text-slate-600">New password</label><input id="authNewPassword" type="password" minlength="8" autocomplete="new-password" placeholder="New password (8+ characters)" class="w-full rounded-lg border border-edge px-3 py-2 text-sm" /><label for="authConfirmPassword" class="text-xs text-slate-600">Confirm new password</label><input id="authConfirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm new password" class="w-full rounded-lg border border-edge px-3 py-2 text-sm" /><button id="authUpdatePassword" type="button" class="rounded-lg bg-ebrand px-3 py-2 text-sm font-semibold text-white">Update password</button></div><button id="authSignout" type="button" hidden class="mt-2 rounded-lg border border-edge px-3 py-2 text-xs">Sign out</button></section>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-3">Documents</h2>

        <div
          id="uploadBox"
          class="border-2 border-dashed border-edge rounded-xl p-6 text-center text-sm text-gray-400 cursor-pointer transition-all duration-200 ease-in-out hover:border-blue-500 hover:scale-[1.02] hover:bg-blue-500/5"
        >
          <input type="file" id="fileInput" accept=".pdf" hidden />
          <p>Drag a PDF here or <span class="text-ebrand underline">browse</span></p>
        </div>
        <div id="uploadStatus" class="mt-2 text-xs min-h-[16px]"></div>

        <ul id="docList" class="mt-5 flex flex-col gap-2">
          <li class="text-sm italic text-gray-600">No documents yet</li>
        </ul>
      </aside>

      <!-- Chat -->
      <section class="chat-panel flex-1 flex flex-col overflow-hidden">
        <div id="messages" class="messages flex-1 overflow-y-auto px-6 py-8 flex flex-col gap-7">
          <div class="text-center text-gray-600 text-sm mt-20">
            Upload a PDF, then ask a question about it.
          </div>
        </div>

        <!-- Input bar -->
        <form id="askForm" class="ask-form px-6 pb-6 pt-2">
          <div class="ask-form-inner max-w-3xl mx-auto flex items-center gap-2 bg-elevated border border-edge rounded-full pl-2 pr-2 py-2 transition-all duration-200 ease-in-out focus-within:border-ebrand focus-within:shadow-[0_0_0_3px_rgba(37,99,235,0.15)]">
            <select
              id="docFilter"
              title="Limit search to one document"
              class="bg-elevated2 text-slate-700 text-xs rounded-full px-3 py-2 border-none outline-none max-w-[150px] cursor-pointer"
            >
              <option value="">All documents</option>
            </select>
            <input
              type="text"
              id="questionInput"
              placeholder="Ask a question about your documents..."
              autocomplete="off"
              class="flex-1 bg-transparent outline-none text-[15px] px-2 placeholder-slate-400"
            />
            <button
              type="submit"
              id="askButton"
              class="bg-ebrand hover:shadow-[0_0_14px_3px_rgba(67,100,247,0.45)] active:scale-95 text-white text-sm font-semibold px-6 py-2.5 rounded-full transition-all duration-200 ease-in-out disabled:opacity-40 disabled:cursor-not-allowed"
            >
              Ask
            </button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
