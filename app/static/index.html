<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMind RAG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: "#0B0C10",
            panel: "#0F1015",
            elevated: "#15161D",
            elevated2: "#1A1C24",
            edge: "#212330",
            neon: "#39FF88",
            ebrand: "#4364F7",
          },
        },
      },
    };
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #23252f; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #2d3040; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(57, 255, 136, 0.55); }
      50% { box-shadow: 0 0 0 5px rgba(57, 255, 136, 0); }
    }
    @keyframes blinkCursor {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes askGlow {
      0% { box-shadow: 0 0 0 0 rgba(67, 100, 247, 0.5); }
      100% { box-shadow: 0 0 14px 3px rgba(67, 100, 247, 0.35); }
    }

    .anim-fadeUp { animation: fadeUp 0.35s ease both; }
    .anim-slideIn { animation: slideInLeft 0.3s ease both; }
    .pulse-dot { animation: pulseGlow 2s ease-in-out infinite; }
    .blink-cursor { animation: blinkCursor 1s steps(1) infinite; }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .accordion-body.open {
      max-height: 300px;
      opacity: 1;
    }
    .chevron { transition: transform 0.2s ease; }
    .chevron.open { transform: rotate(90deg); }
  </style>
</head>
<body class="bg-void text-gray-100 h-screen overflow-hidden">
  <div class="flex flex-col h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between px-7 py-4 border-b border-edge bg-panel">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">DocuMind RAG</h1>
        <p class="text-sm text-gray-500">Ask questions about your documents</p>
      </div>
      <div class="flex items-center gap-2 text-sm text-gray-400">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-gray-600"></span>
        <span id="statusText">Checking...</span>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">

      <!-- Sidebar -->
      <aside class="w-1/4 min-w-[260px] max-w-[340px] border-r border-edge bg-panel p-5 overflow-y-auto">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-3">Documents</h2>

        <div
          id="uploadBox"
          class="border-2 border-dashed border-edge rounded-xl p-6 text-center text-sm text-gray-400 cursor-pointer transition-all duration-200 ease-in-out hover:border-blue-500 hover:scale-[1.02] hover:bg-blue-500/5"
        >
          <input type="file" id="fileInput" accept=".pdf" hidden />
          <p>Drag a PDF here or <span class="text-ebrand underline">browse</span></p>
        </div>
        <div id="uploadStatus" class="mt-2 text-xs min-h-[16px]"></div>

        <ul id="docList" class="mt-5 flex flex-col gap-2">
          <li class="text-sm italic text-gray-600">No documents yet</li>
        </ul>
      </aside>

      <!-- Chat -->
      <section class="flex-1 flex flex-col overflow-hidden">
        <div id="messages" class="flex-1 overflow-y-auto px-6 py-8 flex flex-col gap-7">
          <div class="text-center text-gray-600 text-sm mt-20">
            Upload a PDF, then ask a question about it.
          </div>
        </div>

        <!-- Input bar -->
        <form id="askForm" class="px-6 pb-6 pt-2">
          <div class="max-w-3xl mx-auto flex items-center gap-2 bg-elevated border border-edge rounded-full pl-2 pr-2 py-2 transition-all duration-200 ease-in-out focus-within:border-ebrand focus-within:shadow-[0_0_0_3px_rgba(67,100,247,0.15)]">
            <select
              id="docFilter"
              title="Limit search to one document"
              class="bg-elevated2 text-gray-300 text-xs rounded-full px-3 py-2 border-none outline-none max-w-[150px] cursor-pointer"
            >
              <option value="">All documents</option>
            </select>
            <input
              type="text"
              id="questionInput"
              placeholder="Ask a question about your documents..."
              autocomplete="off"
              class="flex-1 bg-transparent outline-none text-[15px] px-2 placeholder-gray-600"
            />
            <button
              type="submit"
              id="askButton"
              class="bg-ebrand hover:shadow-[0_0_14px_3px_rgba(67,100,247,0.45)] active:scale-95 text-white text-sm font-semibold px-6 py-2.5 rounded-full transition-all duration-200 ease-in-out disabled:opacity-40 disabled:cursor-not-allowed"
            >
              Ask
            </button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
