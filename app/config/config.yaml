# Non-secret runtime configuration. Put API keys in .env.
app:
  name: "DocuMind RAG"
  version: "0.2.0"
  environment: "development"
llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  temperature: 0.1
  max_tokens: 1024
  timeout_seconds: 30
embeddings:
  model_name: "all-MiniLM-L6-v2"
  batch_size: 32
chunking:
  strategy: "recursive"
  chunk_size: 1000
  chunk_overlap: 200
retrieval:
  top_k: 4
  search_type: "similarity"
  mmr_diversity: 0.5
vector_store:
  collection_name: "documind_documents"
  persist_directory: "./data/vector_db"
upload:
  directory: "./data/uploads"
  max_file_size_mb: 20
  allowed_extensions: [".pdf"]
logging:
  level: "INFO"
  format: "json"
